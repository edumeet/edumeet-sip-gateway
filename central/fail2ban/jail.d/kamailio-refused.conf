[kamailio-refused]
enabled = true
backend = systemd
filter = kamailio-refused
port = 5060,5061
protocol = tcp,udp
# A scanner calls about once a second. A room system outside the address table is refused once
# per call, so 30 refusals in 10 minutes block only scanners.
maxretry = 30
findtime = 10m
bantime = 1d

[kamailio-refused-slow]
enabled = true
backend = systemd
filter = kamailio-refused
port = 5060,5061
protocol = tcp,udp
# Slow scanners stay under the limit above with a few calls an hour. Onboarding a room system
# needs one refused call, so 20 in a day still block only scanners.
maxretry = 20
findtime = 1d
bantime = 1w
